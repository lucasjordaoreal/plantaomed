name: Proposta mensal de atualização médica

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run catalog:import:anvisa
      - run: npm run catalog:import:conitec
      - run: npm run catalog:validate
      - run: npm run catalog:generate
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: medical-catalog-proposal
          path: |
            public/data/medical-library/
            docs/ANVISA_IMPORT_REPORT.md
            docs/CONITEC_IMPORT_REPORT.md
          retention-days: 30
